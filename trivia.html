<style>
:root{--bg:#dde5ea;--ink:#1b2b34;--card:#fff;--edge:#9fb0b9;--accent:#0a9396;--ok:#1f8a4c;--bad:#c8372d}
@media(prefers-color-scheme:dark){:root{--bg:#182329;--ink:#e6eef2;--card:#22333b;--edge:#5d7480}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Karla',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
main{width:100%;max-width:560px;background:var(--card);border:1.5px solid var(--edge);border-radius:14px;padding:28px 24px;box-shadow:4px 5px 0 var(--edge)}
h1{font-size:30px;margin-bottom:8px}
p{line-height:1.5}
.muted{opacity:.75;font-size:15px}
.row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}
h2{font-size:22px;line-height:1.3;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt,.go{font:inherit;font-size:17px;text-align:left;padding:12px 14px;border:1.5px solid var(--ink);border-radius:10px;background:none;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt{color:#fff;border:none;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .1s,opacity .2s}
.opt:nth-child(1){background:#2f6fdb}.opt:nth-child(2){background:#a8530a}.opt:nth-child(3){background:#17754a}.opt:nth-child(4){background:#8a4fc7}
.opt:disabled{opacity:.4}
.opt.ok{opacity:1;outline:4px solid var(--ink);outline-offset:2px}
.opt.bad{opacity:.6;text-decoration:line-through}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.alt{background:none;color:inherit;border:1.5px solid var(--ink)}
.go.alt:hover{background:var(--ink);color:var(--card)}
.go{margin-top:22px;text-align:center;font-weight:700;background:var(--accent);border-color:var(--accent);color:#fff;padding:12px 26px}
.go:hover{filter:brightness(1.1);background:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big{font-size:54px;font-weight:700;margin:6px 0}
.hide{display:none}
</style>

<body>
<main>
<a class="home-link" href="index.html">← Volver al inicio</a>
  <section id="start">

  <section id="end" class="hide">

    <button class="go" id="again">Nueva partida</button>
  </section>
</main>

['Historia','¿Qué sistema de escritura usaban los antiguos egipcios?','Jeroglíficos','Cuneiforme','Runas','Alfabeto latino'],
['Geografía','¿Cuál es la capital de Brasil?','Brasilia','Río de Janeiro','San Pablo','Salvador'],

['Arte y cultura','¿De qué país es originaria la pizza?','Italia','Francia','Grecia','Estados Unidos'],
['Arte y cultura','¿De qué país es típico el sushi?','Japón','China','Corea','Tailandia'],
['Arte y cultura','¿Quién dirigió la película Titanic (1997)?','James Cameron','Steven Spielberg','Ridley Scott','Christopher Nolan'],
['Arte y cultura','¿Quién escribió El Aleph?','Jorge Luis Borges','Julio Cortázar','Ernesto Sabato','Leopoldo Lugones'],

['Deportes y general','¿En qué deporte se usa un palo llamado putter?','Golf','Tenis','Hockey','Béisbol'],
['Deportes y general','¿Cuántos anillos tiene la bandera olímpica?','5','4','6','7'],
['Deportes y general','¿Qué país ganó el primer Mundial de fútbol, en 1930?','Uruguay','Argentina','Brasil','Italia'],
['Deportes y general','¿Quién fue el capitán de Argentina campeón en 1986?','Diego Maradona','Daniel Passarella','Mario Kempes','Lionel Messi'],
['Deportes y general','¿Cuántos minutos dura un partido de fútbol, sin descuento?','90','80','100','120'],
['Deportes y general','¿En qué juego se gana con un jaque mate?','Ajedrez','Damas','Póker','Go'],
['Deportes y general','¿Cuántos días tiene un año bisiesto?','366','365','364','367'],
['Deportes y general','¿Qué color resulta de mezclar azul y amarillo?','Verde','Violeta','Naranja','Marrón'],
['Deportes y general','¿Cuántos lados tiene un hexágono?','6','5','7','8'],
['Deportes y general','¿Cuánto es 7 × 8?','56','54','48','63'],
['Deportes y general','¿Cuál es el idioma oficial de Brasil?','Portugués','Español','Inglés','Francés']
];
const ROUND=10,TIME=15;
const $=s=>document.querySelector(s);
const show=id=>['start','quiz','end'].forEach(s=>$('#'+s).classList.toggle('hide',s!==id));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let best=0;try{best=+localStorage.getItem('trivia-best')||0}catch(e){}
const showBest=()=>{const t=best?'Su mejor puntaje: '+best:'Todavía no hay puntaje guardado.';$('#best').textContent=t;$('#best2').textContent=best?'Mejor puntaje: '+best:''};
let qs,i,score,right,left,tm,locked,used=new Set();
function pickSet(){
  let pool=Q.map((_,k)=>k).filter(k=>!used.has(k));
  if(pool.length<ROUND){used.clear();pool=Q.map((_,k)=>k)}
  const ch=shuffle(pool).slice(0,ROUND);ch.forEach(k=>used.add(k));
  return ch.map(k=>Q[k]);
}
function start(keep){
  if(!keep)used.clear();
  qs=pickSet();i=0;score=0;right=0;show('quiz');next();
}
function next(){
  if(i>=qs.length)return finish();
  const [cat,q,ok,...bad]=qs[i];
  locked=false;left=TIME;
  $('#cat').textContent=cat;$('#prog').textContent='Respondidas: '+i+' / '+ROUND;$('#sc').textContent=score+' pts';
  $('#q').textContent=q;$('#fill').style.width='100%';
  const box=$('#opts');box.innerHTML='';
  shuffle([ok,...bad]).forEach((o,n)=>{
    const b=document.createElement('button');b.className='opt';b.dataset.v=o;b.dataset.l='ABCD'[n]+')  ';
    b.textContent=b.dataset.l+o;
    b.onclick=()=>answer(b,o===ok,ok);box.appendChild(b);
  });
  clearInterval(tm);
  tm=setInterval(()=>{
    left-=.1;$('#fill').style.width=Math.max(0,left/TIME*100)+'%';
    if(left<=0)answer(null,false,ok);
  },100);
}
function answer(btn,correct,ok){
  if(locked)return;locked=true;clearInterval(tm);
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===ok){b.classList.add('ok');b.textContent='✓ '+b.dataset.l+b.dataset.v}
  });
  if(btn&&!correct){btn.classList.add('bad');btn.textContent='✗ '+btn.dataset.l+btn.dataset.v}
  if(correct){right++;score+=100+Math.ceil(left)*5}
  i++;
  $('#sc').textContent=score+' pts';
  $('#prog').textContent='Respondidas: '+i+' / '+ROUND;
  setTimeout(next,1100);
}
function finish(){
  if(score>best){best=score;try{localStorage.setItem('trivia-best',best)}catch(e){}}
  $('#final').textContent=score+' pts';
  $('#detail').textContent='Respondió bien '+right+' de '+ROUND+' preguntas.';
  showBest();show('end');
}
$('#play').onclick=()=>start(false);$('#again').onclick=()=>start(false);
showBest();
})();
</script>
